; Supervisor — loterias
;
; Mantém dois processos rodando em background, independente de terminal aberto
; ou de `composer dev` estar ativo:
;
;   1. loterias-scheduler: `php artisan schedule:work` — sem isso, o
;      agendamento em routes/console.php (lottery:sync horário/diário) nunca
;      dispara sozinho (ver CLAUDE.md, seção Comandos).
;   2. loterias-worker: `php artisan queue:work` — consome os jobs que o
;      scheduler/sync despacham (ex.: CheckPendingGamesJob). QUEUE_CONNECTION
;      é "database" (.env), então sem worker os jobs só se acumulam na tabela
;      `jobs` e nunca são processados.
;
; Instalação (symlink para pegar mudanças deste arquivo automaticamente):
;   sudo ln -sf /var/www/projects/loterias/docs/supervisor.conf \
;       /etc/supervisor/conf.d/loterias.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Operação:
;   sudo supervisorctl status
;   sudo supervisorctl restart loterias:*
;   sudo supervisorctl tail -f loterias-worker
;
; ATENÇÃO: se `composer dev` também estiver rodando (ele sobe um
; `queue:listen` próprio), vai haver DOIS consumidores da mesma fila ao mesmo
; tempo. Não corrompe nada (a fila database usa lock por linha), mas duplica
; workers e mistura logs. Se isso incomodar, tirar a linha de queue:listen do
; script "dev" do composer.json, já que o supervisor passa a ser o dono
; permanente do worker.

[group:loterias]
programs=loterias-scheduler,loterias-worker

[program:loterias-scheduler]
command=/usr/bin/php artisan schedule:work
directory=/var/www/projects/loterias
user=marcelo
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/projects/loterias/storage/logs/supervisor-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/projects/loterias/storage/logs/supervisor-scheduler.log
stderr_logfile_maxbytes=10MB

[program:loterias-worker]
command=/usr/bin/php artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=80
directory=/var/www/projects/loterias
user=marcelo
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/var/www/projects/loterias/storage/logs/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/projects/loterias/storage/logs/supervisor-worker.log
stderr_logfile_maxbytes=10MB
